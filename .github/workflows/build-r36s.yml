name: GoldenEye AArch64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libgl-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build-pc -DROMID=ntsc-final

      - name: Build
        run: cmake --build build-pc -j$(nproc)

      - name: Show binary
        run: |
          file build-pc/ge007*
          ls -lh build-pc/ge007*

      - name: Upload AArch64 binary
        uses: actions/upload-artifact@v4
        with:
          name: goldeneye-aarch64
          path: build-pc/ge007.aarch64
