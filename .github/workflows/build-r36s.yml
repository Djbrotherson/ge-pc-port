name: GoldenEye AArch64 R36S GLES Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Show commit
        run: git log -1 --oneline

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libsdl2-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            zlib1g-dev

      - name: Configure for GLES
        run: |
          cmake -S . -B build-pc \
            -DROMID=ntsc-final \
            -DGL_LIBRARY=GLESv2

      - name: Build ge007.aarch64
        run: cmake --build build-pc -j$(nproc)

      - name: Verify binary
        run: |
          file build-pc/ge007.aarch64
          ls -lh build-pc/ge007.aarch64

      - name: Upload ge007.aarch64
        uses: actions/upload-artifact@v4
        with:
          name: ge007-aarch64
          path: build-pc/ge007.aarch64
          if-no-files-found: error
