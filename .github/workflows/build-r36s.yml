name: GoldenEye AArch64 R36S GLES Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - r36s-native-gles
      - r36s-first-frame-noaudio

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Show commit
        run: git log -1 --oneline

      - name: Patch host controller status handshake
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/joy.c')
          s = p.read_text()
          old = '''void joyCheckStatusThreadSafe(void)
          {
              OSMesg  msg;

              if (g_ContQueuesCreated)
              {
                  osSendMesg(&g_ContDisablePollSendMessageQueue, &msg, OS_MESG_NOBLOCK);
                  osRecvMesg(&g_ContDisablePollReceiveMessageQueue, &msg, OS_MESG_BLOCK);

                  joyCheckStatus();

                  osSendMesg(&g_ContEnablePollSendMessageQueue, &msg, OS_MESG_NOBLOCK);
                  osRecvMesg(&g_ContEnablePollReceiveMessageQueue, &msg, OS_MESG_BLOCK);
              }
          }
          '''
          new = '''void joyCheckStatusThreadSafe(void)
          {
          #ifdef PORT
              joyCheckStatus();
              return;
          #else
              OSMesg  msg;

              if (g_ContQueuesCreated)
              {
                  osSendMesg(&g_ContDisablePollSendMessageQueue, &msg, OS_MESG_NOBLOCK);
                  osRecvMesg(&g_ContDisablePollReceiveMessageQueue, &msg, OS_MESG_BLOCK);

                  joyCheckStatus();

                  osSendMesg(&g_ContEnablePollSendMessageQueue, &msg, OS_MESG_NOBLOCK);
                  osRecvMesg(&g_ContEnablePollReceiveMessageQueue, &msg, OS_MESG_BLOCK);
              }
          #endif
          }
          '''
          if old not in s:
              raise SystemExit('joyCheckStatusThreadSafe block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Patch no-audio music fade worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/music.c')
          s = p.read_text()
          old = '''void musicFadeTick(void)
          {
          '''
          new = '''void musicFadeTick(void)
          {
              if (g_sndBootswitchSound)
              {
                  return;
              }
          '''
          if old not in s:
              raise SystemExit('musicFadeTick block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Guard no-audio compact sequence player entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/music.c')
          s = p.read_text()
          signatures = [
              'void musicTrack1ApplySeqpVol(u16 volume)',
              'void musicTrack2ApplySeqpVol(u16 volume)',
              'void musicTrack3ApplySeqpVol(u16 volume)',
              'void musicTrack1FadeIn(f32 fadeTime, u16 volume)',
              'void musicTrack2FadeIn(f32 fadeTime, u16 volume)',
              'void musicTrack3FadeIn(f32 fadeTime, u16 volume)',
          ]
          guard = "\n{\n    if (g_sndBootswitchSound)\n    {\n        return;\n    }\n"
          for sig in signatures:
              old = sig + '\n{\n'
              new = sig + guard
              if old not in s:
                  raise SystemExit(f'{sig} block not found; refusing unsafe patch')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Patch remaining 64-bit image pointer arithmetic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/image.c')
          s = p.read_text()
          replacements = [
              ('outptr = (u8 *)(((u32)outptr + 7) & ~7);',
               'outptr = (u8 *)(((uintptr_t)outptr + 7u) & ~(uintptr_t)7u);'),
              ('u32 *dst32 = (u32 *)(((u32)dst + 0xf) & ~0xf);',
               'u32 *dst32 = (u32 *)(((uintptr_t)dst + 0xfu) & ~(uintptr_t)0xfu);'),
              ('u16 *dst16 = (u16 *)(((u32)dst + 7) & ~7);',
               'u16 *dst16 = (u16 *)(((uintptr_t)dst + 7u) & ~(uintptr_t)7u);'),
              ('u8 *dst8 = (u8 *)(((u32)dst + 7) & ~7);',
               'u8 *dst8 = (u8 *)(((uintptr_t)dst + 7u) & ~(uintptr_t)7u);'),
              ('return (u32)arg0->rightpos - (u32)arg0->leftpos;',
               'return (s32)((u8 *)arg0->rightpos - (u8 *)arg0->leftpos);'),
              ('texLoad((u32 *)((s32)bytes + 4), arg1);',
               'texLoad((u32 *)(bytes + 4), arg1);'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'image.c pattern not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Run 64-bit pointer regression
        run: |
          cat >/tmp/r36s_pointer_regression.c <<'EOF'
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          typedef uint8_t u8; typedef uint16_t u16; typedef uint32_t u32;
          static u8 *align8(u8 *p) { return (u8 *)(((uintptr_t)p + 7u) & ~(uintptr_t)7u); }
          static u32 *align16_u32(u8 *p) { return (u32 *)(((uintptr_t)p + 15u) & ~(uintptr_t)15u); }
          static u16 *align8_u16(u8 *p) { return (u16 *)(((uintptr_t)p + 7u) & ~(uintptr_t)7u); }
          static u32 *gdl_word1(u8 *p) { return (u32 *)(p + 4); }
          int main(void) {
              u8 *p = malloc(256);
              if (!p) return 2;
              uintptr_t b = (uintptr_t)p;
              if ((b >> 32) == 0) return 3;
              if ((uintptr_t)align8(p + 1) < b) return 10;
              if ((uintptr_t)align16_u32(p + 3) < b) return 11;
              if ((uintptr_t)align8_u16(p + 5) < b) return 12;
              if ((uintptr_t)gdl_word1(p + 16) != b + 20) return 13;
              puts("64-bit pointer regression PASS");
              free(p);
              return 0;
          }
          EOF
          cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer /tmp/r36s_pointer_regression.c -o /tmp/r36s_pointer_regression
          ASAN_OPTIONS=detect_leaks=0 /tmp/r36s_pointer_regression

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libsdl2-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            zlib1g-dev

      - name: Configure native GLES build
        run: |
          cmake -S . -B build-pc \
            -DROMID=ntsc-final \
            -DGL_LIBRARY=GLESv2 \
            -DCMAKE_C_FLAGS="-DUSE_GLES=1" \
            -DCMAKE_CXX_FLAGS="-DUSE_GLES=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-Map=ge007.link.map -Wl,--cref"

      - name: Build ge007.aarch64
        run: cmake --build build-pc -j$(nproc)

      - name: Verify binary and emit symbols
        run: |
          file build-pc/ge007.aarch64
          ls -lh build-pc/ge007.aarch64
          nm -n build-pc/ge007.aarch64 > build-pc/ge007.symbols.txt
          objdump -d build-pc/ge007.aarch64 > build-pc/ge007.disasm.txt

      - name: Upload ge007.aarch64
        uses: actions/upload-artifact@v4
        with:
          name: ge007-aarch64-native-gles-noaudio
          path: |
            build-pc/ge007.aarch64
            build-pc/ge007.link.map
            build-pc/ge007.symbols.txt
            build-pc/ge007.disasm.txt
          if-no-files-found: error
