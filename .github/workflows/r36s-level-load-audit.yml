name: R36S Level Loading Audit

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install AArch64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev:arm64 \
            libsdl2-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            zlib1g-dev:arm64

      - name: Configure R36S AArch64 GLES cross-build
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: |
          cmake -S . -B build-audit \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux.cmake \
            -DROMID=ntsc-final \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so \
            -DZLIB_INCLUDE_DIR=/usr/include \
            -DZLIB_LIBRARY=/usr/lib/aarch64-linux-gnu/libz.so \
            -DGL_LIBRARY=/usr/lib/aarch64-linux-gnu/libGLESv2.so \
            -DCMAKE_C_FLAGS="-DUSE_GLES=1 -Wall -Wextra -Wpointer-to-int-cast -Wint-to-pointer-cast -Wconversion" \
            -DCMAKE_CXX_FLAGS="-DUSE_GLES=1 -Wall -Wextra"

      - name: Build and capture warnings
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-audit -j"$(nproc)" 2>&1 | tee r36s-level-load-build.log

      - name: Generate level-loading frontier report
        if: always()
        run: |
          python3 tools/r36s_level_load_audit.py \
            --repo . \
            --warnings r36s-level-load-build.log \
            --outdir audit-out
          cat audit-out/r36s-level-load-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload level-loading audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36s-level-load-audit
          path: |
            audit-out/r36s-level-load-report.md
            audit-out/r36s-level-load-findings.tsv
            r36s-level-load-build.log
          if-no-files-found: warn
