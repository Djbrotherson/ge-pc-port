name: Portkit Semantic Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'port/**'
      - 'portkit/**'
      - 'tools/n64_port.py'
      - 'tools/n64_port_audit.py'
      - 'tools/port_audit_engine.py'
      - 'tools/n64_portlib/**'
      - 'tools/integration_profiles/**'
      - 'tools_pc/d43_emit.py'
      - 'tools_pc/d69_emit.py'
      - 'tools_pc/d88_emit.py'
      - 'tools_pc/d88_propdefs.py'
      - '.github/workflows/portkit-gate.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Portkit gate
        run: |
          set -o pipefail
          python3 tools/n64_port.py gate | tee portkit-gate.log

      - name: Publish semantic report
        if: always()
        run: |
          test -f semantic-audit-out/semantic-report.md &&
            cat semantic-audit-out/semantic-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portkit-semantic-gate
          path: |
            semantic-audit-out/semantic-report.md
            semantic-audit-out/semantic-findings.tsv
            portkit-gate.log
          if-no-files-found: warn
