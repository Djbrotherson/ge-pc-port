name: R36S Whole Codebase LP64 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - r36s-first-frame-noaudio
    paths:
      - 'src/**'
      - 'include/**'
      - 'port/**'
      - 'assets/**/*.h'
      - 'tools/r36s_lp64_audit.py'
      - '.github/workflows/r36s-lp64-audit.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'port/**'
      - 'assets/**/*.h'
      - 'tools/r36s_lp64_audit.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install AArch64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev:arm64 \
            libsdl2-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            zlib1g-dev:arm64

      - name: Configure full-warning AArch64 cross-build
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: |
          cmake -S . -B build-lp64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux.cmake \
            -DROMID=ntsc-final \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so \
            -DZLIB_INCLUDE_DIR=/usr/include \
            -DZLIB_LIBRARY=/usr/lib/aarch64-linux-gnu/libz.so \
            -DGL_LIBRARY=/usr/lib/aarch64-linux-gnu/libGLESv2.so \
            -DCMAKE_C_FLAGS="-DUSE_GLES=1 -Wall -Wextra -Wpointer-to-int-cast -Wint-to-pointer-cast -Wconversion -Wsign-conversion -Warray-bounds" \
            -DCMAKE_CXX_FLAGS="-DUSE_GLES=1 -Wall -Wextra"

      - name: Build and capture all warnings
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-lp64 -j"$(nproc)" 2>&1 | tee r36s-lp64-build.log

      - name: Generate whole-codebase LP64 report
        if: always()
        run: |
          python3 tools/r36s_lp64_audit.py             --repo .             --warnings r36s-lp64-build.log             --outdir lp64-audit-out
          cat lp64-audit-out/r36s-lp64-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LP64 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36s-lp64-audit
          path: |
            lp64-audit-out/r36s-lp64-report.md
            lp64-audit-out/r36s-lp64-findings.tsv
            r36s-lp64-build.log
