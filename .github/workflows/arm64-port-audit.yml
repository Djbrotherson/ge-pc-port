name: ARM64 Port Audit

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static ARM64 port scan
        run: |
          python3 tools/arm64_port_audit.py             --json arm64-port-audit.json             --markdown arm64-port-audit.md
          cat arm64-port-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install AArch64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev:arm64 \
            libsdl2-dev:arm64 \
            libgles2-mesa-dev:arm64 \
            libegl1-mesa-dev:arm64 \
            zlib1g-dev:arm64

      - name: Configure AArch64 GLES cross-build with pointer warnings
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: |
          cmake -S . -B build-audit \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux.cmake \
            -DROMID=ntsc-final \
            -DSDL2_INCLUDE_DIR=/usr/include/SDL2 \
            -DSDL2_LIBRARY=/usr/lib/aarch64-linux-gnu/libSDL2.so \
            -DZLIB_INCLUDE_DIR=/usr/include \
            -DZLIB_LIBRARY=/usr/lib/aarch64-linux-gnu/libz.so \
            -DGL_LIBRARY=/usr/lib/aarch64-linux-gnu/libGLESv2.so \
            -DCMAKE_C_FLAGS="-DUSE_GLES=1 -Wpointer-to-int-cast -Wint-to-pointer-cast -Wconversion" \
            -DCMAKE_CXX_FLAGS="-DUSE_GLES=1 -Wconversion" \
            2>&1 | tee configure-audit.log

      - name: Build and capture warnings
        continue-on-error: true
        run: |
          cmake --build build-audit -j$(nproc) 2>&1 | tee build-audit.log
          grep -nE "warning:|error:" build-audit.log > compiler-findings.txt || true
          {
            echo
            echo "## Compiler warning sample"
            echo
            if [ -s compiler-findings.txt ]; then
              head -200 compiler-findings.txt
            else
              echo "No matching compiler warnings/errors captured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: arm64-port-audit
          path: |
            arm64-port-audit.json
            arm64-port-audit.md
            configure-audit.log
            build-audit.log
            compiler-findings.txt
          if-no-files-found: error
