name: Bug report
description: Report a reproducible ARM-GE / R36S / runtime defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - R36S runtime
        - Graphics / GLES
        - Audio
        - Input
        - Save / storage
        - PortMaster packaging
        - Binary conversion
        - Semantic / ABI tooling
        - Portkit
        - Build / CI
        - Other
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Exact main commit SHA tested.
      placeholder: abcdef123456...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal deterministic steps.
      placeholder: |
        1. Launch...
        2. Load...
        3. Trigger...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, crash addresses, screenshots, mission/level, or other useful proof.

  - type: dropdown
    id: clean_boot
    attributes:
      label: Reproduces after a clean boot?
      options:
        - "Yes"
        - "No"
        - "Not tested"
    validations:
      required: true

  - type: checkboxes
    id: legal
    attributes:
      label: Content check
      options:
        - label: I did not attach a ROM, extracted proprietary game assets, credentials, or unrelated private data.
          required: true
